[server]
headless = true
address = "127.0.0.1"
maxUploadSize = 200
enableXsrfProtection = true
fileWatcherType = "none"
enableStaticServing = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#14513B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F4EF"
textColor = "#1B2B24"
font = "sans serif"
